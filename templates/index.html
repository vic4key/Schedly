<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Schedly</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Flatpickr CSS -->
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>⏰</text></svg>">
    <style>
        .breaks-box { background: #f8f9fa; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
        .break-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .break-row input[type="text"] {
            flex: 1;
            margin-right: 8px;
        }
        .break-row button {
            color: #dc3545;
            border-color: #dc3545;
            min-width: 42px;
            font-weight: bold;
            font-size: 20px;
            border-radius: 0.375rem;
            padding: 0 12px;
            background: #fff;
            height: 38px;
        }
        .break-row button:hover { background: #f8d7da; }
        #add-break { margin-top: 6px; margin-bottom: 6px;}
        .form-label { font-weight: bold; margin-bottom: 2px; display: block;}
        input[type="text"], textarea { box-sizing: border-box; width: 100%; }
        .result { background: #f6f6f6; padding: 10px; border-radius: 4px; margin-top: 20px; }
        pre { font-size: 14px; }
    </style>
</head>
<body>
<div class="container mt-3" style="max-width: 700px;">
    <div style="text-align:center; margin-bottom:10px;">
        <span style="font-size:2.2rem; font-weight:bold; color:#0d6efd; letter-spacing:2px;">Schedly</span>
    </div>
    <form method="post" id="schedule-form" autocomplete="off">
        <div class="mb-3">
            <label class="form-label">Khung giờ làm việc trong ngày
                <small>(Ví dụ: 08:00-12:00,13:00-17:00)</small>
            </label>
            <input type="text" class="form-control" name="working_day_time_range" required placeholder="VD: 08:00-12:00,13:00-17:00">
        </div>
        <div class="mb-3">
            <label class="form-label">Thời điểm bắt đầu
                <small>(Ví dụ: 2025/06/03 13:00)</small>
            </label>
            <input type="text" class="form-control flatpickr-datetime" name="start_time" required placeholder="VD: 2025/06/03 13:00">
        </div>
        <div class="mb-3">
            <label class="form-label">Danh sách công việc
                <small>(Mỗi dòng: tên task, est. VD: task 1, 2 hrs)</small>
            </label>
            <textarea class="form-control" name="task_list" rows="5" required></textarea>
        </div>

        <div class="breaks-box mb-3">
            <label class="form-label">Các khoảng thời gian nghỉ (nếu có)</label>
            <div id="breaks-list"></div>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="add-break">+ Thêm khoảng nghỉ</button>
            <div style="font-size:13px; color:#666; margin-top:8px;">
                Bạn có thể thêm nhiều khoảng nghỉ.<br>
                Mỗi khoảng nhập theo dạng: YYYY/MM/DD HH:MM - YYYY/MM/DD HH:MM hoặc YYYY/MM/DD HH:MM đến YYYY/MM/DD HH:MM
            </div>
        </div>

        <!-- Output format option -->
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" value="detail" id="details-option" name="output_format">
            <label class="form-check-label" for="details-option">
                Xuất chi tiết từng khoảng nhỏ (details)
            </label>
        </div>

        <button type="submit" class="btn btn-primary">Tính lịch</button>
    </form>

    {% if csv_content %}
        <div class="result mt-4">
            <b>Kết quả CSV (<a href="#" id="download-csv-link">Save to CSV</a>):</b>
            <pre id="csv-result" style="display:none;">{{ csv_content }}</pre>
            <div id="csv-table"></div>
        </div>
    {% endif %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
const STORAGE_KEY = 'work_schedule_v1';
const OUTPUT_FORMAT_KEY = 'work_schedule_output_format';

// -- Data model CRUD --
function loadModel() {
    let m = localStorage.getItem(STORAGE_KEY);
    if (!m) {
        return {
            working_day_time_range: "08:00-12:00,13:00-17:00",
            start_time: "2025/06/03 13:00",
            task_list: "task 1, 2 hrs\ntask 2, 4 hrs\ntask 3, 6 hrs",
            non_working_day_date_time_range: [
                // "2025/06/03 08:00-2025/06/03 12:00",
            ]
        };
    }
    try {
        return JSON.parse(m);
    } catch {
        return {
            working_day_time_range: "",
            start_time: "",
            task_list: "",
            non_working_day_date_time_range: [""]
        };
    }
}
function saveModel(model) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(model));
}
function getModelFromForm() {
    return {
        working_day_time_range: document.querySelector('input[name="working_day_time_range"]').value,
        start_time: document.querySelector('input[name="start_time"]').value,
        task_list: document.querySelector('textarea[name="task_list"]').value,
        non_working_day_date_time_range:
            Array.from(document.querySelectorAll('input[name="non_working_day_date_time_range"]')).map(i => i.value)
    };
}
function renderForm(model) {
    document.querySelector('input[name="working_day_time_range"]').value = model.working_day_time_range || "";
    document.querySelector('input[name="start_time"]').value = model.start_time || "";
    document.querySelector('textarea[name="task_list"]').value = model.task_list || "";
    // breaks
    const breaksList = document.getElementById('breaks-list');
    breaksList.innerHTML = "";
    const arr = model.non_working_day_date_time_range && model.non_working_day_date_time_range.length
        ? model.non_working_day_date_time_range
        : [""];
    arr.forEach(val => addBreakField(val));
    updateRemove();
}

// -- Breaks UI logic --
function makeBreakInput(value="") {
    return `
        <div class="break-row">
            <input type="text" class="form-control break-flatpickr" name="non_working_day_date_time_range"
                placeholder="YYYY/MM/DD HH:MM-YYYY/MM/DD HH:MM" value="${value}">
            <button type="button" class="btn btn-outline-danger ms-1 remove-break" title="Xóa">X</button>
        </div>
    `;
}
function updateRemove() {
    let n = document.querySelectorAll('.break-row').length;
    document.querySelectorAll('.remove-break').forEach(btn => {
        btn.style.display = (n > 1) ? '' : 'none';
    });
}
function addBreakField(value="") {
    const $div = document.createElement('div');
    $div.innerHTML = makeBreakInput(value);
    const row = $div.firstElementChild;
    document.getElementById('breaks-list').appendChild(row);
    enableFlatpickrOnInput(row.querySelector('input[name="non_working_day_date_time_range"]'));
    updateRemove();
}

// --- Sự kiện ---
document.getElementById('add-break').onclick = function() {
    addBreakField();
    saveModel(getModelFromForm());
};
document.getElementById('breaks-list').addEventListener('click', function(e){
    if(e.target.classList.contains('remove-break')) {
        e.target.closest('.break-row').remove();
        updateRemove();
        saveModel(getModelFromForm());
    }
});
document.querySelector('input[name="working_day_time_range"]').addEventListener('input', () => saveModel(getModelFromForm()));
document.querySelector('input[name="start_time"]').addEventListener('input', () => saveModel(getModelFromForm()));
document.querySelector('textarea[name="task_list"]').addEventListener('input', () => saveModel(getModelFromForm()));
document.getElementById('breaks-list').addEventListener('input', function(e){
    if(e.target.name === 'non_working_day_date_time_range') saveModel(getModelFromForm());
});

// -- Flatpickr for break ranges --
function enableFlatpickrOnInput(input) {
    if (!input) return;
    flatpickr(input, {
        locale: { ...flatpickr.l10ns.vn, firstDayOfWeek: 1, rangeSeparator: '-' },
        enableTime: true,
        dateFormat: "Y/m/d H:i",
        time_24hr: true,
        mode: "range",
        allowInput: true,
        altInput: true,
        altFormat: "Y/m/d H:i",
        // Khi chọn xong sẽ tự động format lại cho đúng dạng hiển thị
        onClose: function(selectedDates, dateStr, instance) {
            if (selectedDates.length === 2) {
                // CHỈNH DẤU KẾT NỐI Ở ĐÂY:
                // Nếu muốn dạng "đến" thì sửa thành 'to' thay vì '-'
                let d1 = flatpickr.formatDate(selectedDates[0], "Y/m/d H:i");
                let d2 = flatpickr.formatDate(selectedDates[1], "Y/m/d H:i");
                let dr = `${d1}-${d2}`;
                input.value = dr;
                // Lưu xuống localStorage
                let model = getModelFromForm();
                saveModel(model);
            }
        },
        // Fix trường hợp copy/paste hoặc reload lại value cũ
        parseDate: function(datestr, format) {
            // Hỗ trợ cả dấu '-' và ' đến '
            let parts = datestr.split(/\s*-\s*|\s*đến\s*/i);
            if(parts.length === 2) {
                return [flatpickr.parseDate(parts[0].trim(), "Y/m/d H:i"), flatpickr.parseDate(parts[1].trim(), "Y/m/d H:i")];
            }
            return flatpickr.parseDate(datestr, "Y/m/d H:i");
        }
    });
}

// -- Lưu riêng trạng thái checkbox details --
document.getElementById('details-option').addEventListener('change', function() {
    localStorage.setItem(OUTPUT_FORMAT_KEY, this.checked ? "detail" : "");
});

// -- Load form khi mở --
window.addEventListener('DOMContentLoaded', function() {
    renderForm(loadModel());
    // Khôi phục trạng thái output_format nếu đã lưu
    const checked = localStorage.getItem(OUTPUT_FORMAT_KEY) === "detail";
    document.getElementById('details-option').checked = checked;

    // Gắn Flatpickr cho tất cả các input khoảng nghỉ đã có khi render
    document.querySelectorAll('input[name="non_working_day_date_time_range"]').forEach(enableFlatpickrOnInput);

    // Gắn Flatpickr cho input Thời điểm bắt đầu
    var startTimeInput = document.querySelector('input.flatpickr-datetime[name="start_time"]');
    if(startTimeInput) {
        flatpickr(startTimeInput, {
            locale: { ...flatpickr.l10ns.vn, firstDayOfWeek: 1 },
            enableTime: true,
            dateFormat: "Y/m/d H:i",
            time_24hr: true,
            allowInput: true,
            altInput: true,
            altFormat: "Y/m/d H:i"
        });
    }

    // Gắn chức năng Save to CSV nếu có kết quả
    var downloadLink = document.getElementById('download-csv-link');
    var csvPre = document.getElementById('csv-result');
    if(downloadLink && csvPre) {
        downloadLink.addEventListener('click', function(e) {
            e.preventDefault();
            var csv = csvPre.textContent || csvPre.innerText;
            var blob = new Blob([csv], {type: 'text/csv'});
            var url = window.URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'schedule.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { window.URL.revokeObjectURL(url); }, 500);
        });
    }
    // Hiển thị CSV dưới dạng bảng
    var csvTableDiv = document.getElementById('csv-table');
    if(csvPre && csvTableDiv) {
        var csv = csvPre.textContent || csvPre.innerText;
        if(csv.trim()) {
            csvTableDiv.innerHTML = csvToTable(csv);
        }
    }
});

// Thêm hàm chuyển CSV thành bảng HTML
function csvToTable(csv) {
    // Tách dòng, bỏ dòng rỗng cuối nếu có
    var rows = csv.split(/\r?\n/).filter(r => r.trim().length > 0);
    if(rows.length === 0) return '';
    var html = '<table class="table table-bordered table-sm mt-2">';
    rows.forEach(function(row, idx) {
        var cols = row.split(',');
        html += '<tr>';
        cols.forEach(function(col) {
            var cell = col.replace(/"/g, '').trim();
            if(idx === 0) html += '<th>' + cell + '</th>';
            else html += '<td>' + cell + '</td>';
        });
        html += '</tr>';
    });
    html += '</table>';
    return html;
}
</script>
</body>
</html>
